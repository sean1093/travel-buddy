<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <title>隨身旅伴・日本 (TravelBuddy)</title>
    <meta
      name="description"
      content="不會日文也能在日本 10 秒內把事情辦完：替你念出日文，或放大給對方看。求救卡、交通與購物情境句、指指卡、醫療與過敏卡，離線也能用。"
    />
    <!-- Personal data travels in the URL fragment: never leak the page URL to other sites. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="隨身旅伴" />
    <script>
      // Mirrors applySettings() in src/state.ts. It has to run before the first
      // paint, or opening the app in dark mode flashes the light paper.
      try {
        // Same key as the settings store (STORE_PREFIX in src/lib/store.ts).
        const saved = JSON.parse(localStorage.getItem("travelbuddy.japan.settings") || "null");
        const s = (saved && saved.data) || {};
        const theme =
          s.theme === "light" || s.theme === "dark"
            ? s.theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.textSize = s.textSize === "xlarge" ? "xlarge" : "large";
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#1c1a17" : "#f4efe6";
      } catch {}
    </script>
  </head>
  <body>
    <div id="app" class="mx-auto min-h-dvh max-w-xl"></div>
    <noscript>請開啟 JavaScript 才能使用隨身旅伴。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
