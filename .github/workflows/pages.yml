name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a production deploy midway: a cancelled deploy-pages can
  # leave a deployment stuck pending and block every later one.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json engines + .npmrc engine-strict: npm ci fails outside the range.
          node-version: "24"
          cache: npm

      - run: npm ci
      # Not the freshness check: an overdue entry is already live, and blocking the
      # deploy would only hold back fixes. PRs (ci.yml) are where it is enforced.
      - run: npx vitest run --exclude tests/freshness.test.ts
      # Typechecks, then builds.
      - run: npm run build
      # Browser journeys gate the deploy too: a push or a manual run that skipped the
      # PR checks must not ship an offline or routing regression. Same browser cache as ci.yml.
      - id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
