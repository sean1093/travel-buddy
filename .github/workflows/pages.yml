name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a production deploy midway: a cancelled deploy-pages can
  # leave a deployment stuck pending and block every later one.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json engines + .npmrc engine-strict: npm ci fails outside the range.
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm test
      # Typechecks, then builds.
      - run: npm run build
      # Browser journeys gate the deploy too: a push or a manual run that skipped the
      # PR checks must not ship an offline or routing regression.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
